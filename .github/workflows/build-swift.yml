name: Swift CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "bwell-swift-ios/**"
      - ".github/workflows/build-swift.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "bwell-swift-ios/**"
      - ".github/workflows/build-swift.yml"

jobs:
  build:
    name: Build
    runs-on: macos-latest
    # Hard ceiling - a hung package resolution must fail fast.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Pin Xcode itself (not a standalone Swift toolchain) so the compiler
      # and SDK stay a matched pair - same pattern bwell-sdk's Swift CI uses.
      # Via setup-xcode rather than a hardcoded /Applications path: the exact
      # app-bundle name/set of pre-installed versions on macos-latest shifts
      # between runner-image updates (already hit this once with the
      # simulator device list going stale) - this resolves against whatever
      # versions are actually present and fails clearly if 26.5 is gone,
      # instead of a silent path-not-found.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      # .env is gitignored (never committed - real credentials only) but the
      # app target's Copy Bundle Resources phase requires the file to exist,
      # even empty, or the build fails on a clean checkout like this one.
      - name: Create placeholder .env
        run: touch bwell-swift-ios/bwell-swift-ios/.env

      - name: Build
        run: |
          xcodebuild build \
            -project bwell-swift-ios/bwell-swift-ios.xcodeproj \
            -scheme bwell-swift-ios \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
